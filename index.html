<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>红楼梦 - 大观园之战</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      overflow: hidden;
      background: #000;
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Loading screen */
    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 1000;
      transition: opacity 0.5s;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-size: 48px;
      margin-bottom: 20px;
      background: linear-gradient(45deg, #ff6b6b, #ffd93d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .loading-bar {
      width: 300px;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-progress {
      height: 100%;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d);
      transition: width 0.3s;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .health-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 300px;
    }

    .bar-label {
      font-size: 14px;
      color: #fff;
      margin-bottom: 5px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    .bar-container {
      width: 100%;
      height: 24px;
      background: rgba(0,0,0,0.6);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ef4444, #dc2626);
      transition: width 0.2s;
      position: relative;
    }

    .bar-fill.health {
      background: linear-gradient(90deg, #4ade80, #22c55e);
    }

    .bar-fill.stamina {
      background: linear-gradient(90deg, #60a5fa, #3b82f6);
    }

    .bar-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      color: #fff;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    .stamina-bar {
      position: absolute;
      top: 60px;
      left: 20px;
      width: 200px;
    }

    /* Skills */
    .skills {
      position: absolute;
      bottom: 40px;
      right: 40px;
      display: flex;
      gap: 10px;
    }

    .skill {
      width: 60px;
      height: 60px;
      background: rgba(0,0,0,0.7);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 12px;
      position: relative;
      overflow: hidden;
    }

    .skill-key {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .skill-name {
      font-size: 10px;
      opacity: 0.8;
    }

    .skill-cooldown {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
    }

    /* Controls hint */
    .controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">
      <h1 class="loading-title">红楼梦 · 大观园之战</h1>
      <div class="loading-bar">
        <div class="loading-progress" id="progress" style="width: 0%"></div>
      </div>
      <p style="margin-top: 10px; opacity: 0.7;">加载中...</p>
    </div>

    <div id="hud" style="display: none;">
      <div class="health-bar">
        <div class="bar-label">生命值</div>
        <div class="bar-container">
          <div class="bar-fill health" id="health" style="width: 100%"></div>
          <div class="bar-text" id="health-text">1000 / 1000</div>
        </div>
      </div>

      <div class="stamina-bar">
        <div class="bar-label">精力</div>
        <div class="bar-container">
          <div class="bar-fill stamina" id="stamina" style="width: 100%"></div>
          <div class="bar-text" id="stamina-text">100 / 100</div>
        </div>
      </div>

      <div class="skills">
        <div class="skill">
          <div class="skill-key">Q</div>
          <div class="skill-name">落英神剑</div>
        </div>
        <div class="skill">
          <div class="skill-key">E</div>
          <div class="skill-name">剑气斩</div>
        </div>
      </div>

      <div class="controls">
        WASD - 移动 | 鼠标 - 转向 | 左键 - 攻击<br>
        右键 - 重击 | Shift - 闪避 | Space - 格挡
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
